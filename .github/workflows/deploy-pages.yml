name: Deploy version archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build current version (V3)
        run: |
          npm ci
          npm run build -- --base=./
          node scripts/postbuild.mjs dist V3 ../
          mkdir -p site/v3
          cp -r dist/. site/v3/

      - name: Checkout V1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.0.0
          path: v1-src
          persist-credentials: false

      - name: Build V1
        run: |
          cd v1-src
          npm ci
          npm run build -- --base=./
          cd ..
          node scripts/postbuild.mjs v1-src/dist V1 ../
          mkdir -p site/v1
          cp -r v1-src/dist/. site/v1/

      - name: Checkout V2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v2.0.0
          path: v2-src
          persist-credentials: false

      - name: Build V2
        run: |
          cd v2-src
          npm ci
          npm run build -- --base=./
          cd ..
          node scripts/postbuild.mjs v2-src/dist V2 ../
          mkdir -p site/v2
          cp -r v2-src/dist/. site/v2/

      - name: Verify subpath-safe assets
        run: node scripts/check-assets.mjs dist v1-src/dist v2-src/dist

      - name: Add version hub
        run: cp versions/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
